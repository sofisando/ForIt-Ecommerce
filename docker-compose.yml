services:
  postgres:
    image: postgres:17
    container_name: forit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder

    container_name: forit-migration

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "pnpm",
        "--filter",
        "backend",
        "exec",
        "prisma",
        "migrate",
        "deploy",
        "--schema",
        "src/infra/prisma/schema.prisma"
      ]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production

    container_name: forit-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data: